name: Run weather analysis

on:
    push:
        branches: 
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install venv
              run: |
                python -m venv .venv
                source venv/bin/activate
                pip install .

            - name: Test summary
              run: |
                source venv/bin/activate
                weather-cli summary --input data/weather_hourly.csv --start 2023-01-01 --end 2023-01-31 >> "GITHUB_INPUT"

            - name: Test check
              run: |
                source venv/bin/activate
                weather-cli check --input data/weather_hourly.csv 
            
            - uses : actions/upload_artificat@v6
              with : 
                name : my-artificat 
                path: |
                  temperature_2m_trend.png
            
            - name: Test code 
              run: |
                source venv/bin/activate
                pytest
            